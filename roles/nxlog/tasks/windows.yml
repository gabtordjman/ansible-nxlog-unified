---
# ============================================================================
# IP ADDRESS - Retrieve from inventory
# ============================================================================
- name: Set host IP address from inventory
  set_fact:
    nxlog_host_ip: "{{ ansible_host }}"

# ============================================================================
# CHECK EXISTING INSTALLATION
# ============================================================================
# Method 1: Check via Windows service (win_service module)
- name: Check if NXLog service exists
  win_service:
    name: '{{ nxlog_service_name }}'
  register: nxlog_service_check
  changed_when: false
  ignore_errors: yes  # Avoid error if service does not exist

# Method 2: Check via executable file (win_stat module)
- name: Check if NXLog executable exists
  win_stat:
    path: '{{ nxlog_windows_install_dir }}\nxlog.exe'
  register: nxlog_exe_check
  changed_when: false

# Method 3: Check via Windows registry (win_reg_stat module)
- name: Look for NXLog in the uninstall registry
  win_reg_stat:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall
  register: uninstall_registry
  changed_when: false

# Determine current version based on checks
- name: Determine current NXLog version on Windows
  set_fact:
    nxlog_current_version: >-
      {{
        'NOT_INSTALLED' if not nxlog_service_check.exists and 
                          not nxlog_exe_check.stat.exists
        else 'INSTALLED_NO_VERSION'
      }}

# ============================================================================
# INSTALLATION CONDITIONS
# ============================================================================
- name: Determine if installation or update is required
  set_fact:
    nxlog_needs_install: >-
      {{
        nxlog_current_version == 'NOT_INSTALLED' or
        nxlog_current_version == 'INSTALLED_NO_VERSION'
      }}

# ============================================================================
# INSTALLATION / UPDATE (only if required)
# ============================================================================
- name: Create temporary directory on Windows
  win_file:
    path: '{{ nxlog_windows_temp_dir }}'
    state: directory
  when: nxlog_needs_install | bool

- name: Copy NXLog MSI package
  win_copy:
    src: '{{ nxlog_msi_filename }}'
    dest: '{{ nxlog_windows_temp_dir }}\{{ nxlog_msi_filename }}'
  when: nxlog_needs_install | bool

- name: Install or update NXLog on Windows
  win_package:
    path: '{{ nxlog_windows_temp_dir }}\{{ nxlog_msi_filename }}'
    state: present
    arguments: '{{ nxlog_msi_arguments }}'
  register: nxlog_installation
  when: nxlog_needs_install | bool

# ============================================================================
# DETECT INSTALLATION PATH
# ============================================================================
- name: Test possible installation paths
  win_stat:
    path: '{{ item }}\nxlog.exe'
  loop:
    - 'C:\Program Files\nxlog'
    - 'C:\Program Files (x86)\nxlog'
  register: nxlog_path_tests
  when: nxlog_installation is changed or nxlog_current_version != 'NOT_INSTALLED'

- name: Determine actual installation path
  set_fact:
    nxlog_actual_install_dir: >-
      {{
        (nxlog_path_tests.results |
        selectattr('stat.exists', 'equalto', true) |
        map(attribute='item') |
        first)
        if nxlog_path_tests.results is defined and nxlog_path_tests.results
        else nxlog_windows_install_dir
      }}
  when: nxlog_installation is changed or nxlog_current_version != 'NOT_INSTALLED'

- name: Set configuration directory path
  set_fact:
    nxlog_final_conf_dir: '{{ nxlog_actual_install_dir }}\conf'
  when: nxlog_installation is changed or nxlog_current_version != 'NOT_INSTALLED'

# ============================================================================
# CONFIGURATION
# ============================================================================
- name: Create NXLog configuration directory on Windows
  win_file:
    path: '{{ nxlog_final_conf_dir }}'
    state: directory
  when: nxlog_installation is changed or nxlog_current_version != 'NOT_INSTALLED'

- name: Deploy NXLog Windows configuration
  win_template:
    src: nxlog-windows.conf.j2
    dest: '{{ nxlog_final_conf_dir }}\nxlog.conf'
  notify: restart nxlog windows
  when: nxlog_installation is changed or nxlog_current_version != 'NOT_INSTALLED'

# ============================================================================
# SERVICE MANAGEMENT
# ============================================================================
- name: Check NXLog service existence
  win_service:
    name: '{{ nxlog_service_name }}'
    state: started
  register: service_check
  changed_when: false
  when: nxlog_installation is changed or nxlog_current_version != 'NOT_INSTALLED'

- name: Set service startup mode to automatic
  win_service:
    name: '{{ nxlog_service_name }}'
    start_mode: auto
  when: >
    (nxlog_installation is changed or nxlog_current_version != 'NOT_INSTALLED')
    and service_check.exists

- name: Warn if NXLog service is missing
  debug:
    msg: "WARNING: NXLog service '{{ nxlog_service_name }}' does not exist."
  when: >
    (nxlog_installation is changed or nxlog_current_version != 'NOT_INSTALLED')
    and not service_check.exists

# ============================================================================
# CLEANUP
# ============================================================================
- name: Remove temporary directory on Windows
  win_file:
    path: '{{ nxlog_windows_temp_dir }}'
    state: absent
  when: nxlog_needs_install | bool and nxlog_installation is changed