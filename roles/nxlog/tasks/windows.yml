---
# ============================================================================
# FORÇAGE DE L'ADRESSE IP - SOLUTION GARANTIE
# ============================================================================
- name: FORCER l'adresse IP depuis l'inventaire
  set_fact:
    nxlog_host_ip: "{{ ansible_host }}"

# ============================================================================
# VÉRIFICATION DE L'INSTALLATION EXISTANTE
# ============================================================================
# Méthode 1: Vérifier via le service Windows (module win_service)
- name: Vérifier si le service NXLog existe via service
  win_service:
    name: '{{ nxlog_service_name }}'
  register: nxlog_service_check
  changed_when: false
  ignore_errors: yes  # Pour éviter l'erreur si service n'existe pas

# Méthode 2: Vérifier via le fichier d'exécutable (module win_stat)
- name: Vérifier si l'exécutable NXLog existe
  win_stat:
    path: '{{ nxlog_windows_install_dir }}\nxlog.exe'
  register: nxlog_exe_check
  changed_when: false

# Méthode 3: Vérifier via le registre Windows (module win_reg_stat)
- name: Chercher NXLog dans le registre d'installation
  win_reg_stat:
    path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall
  register: uninstall_registry
  changed_when: false

# Déterminer la version actuelle basée sur les vérifications
- name: Déterminer la version actuelle de NXLog Windows
  set_fact:
    nxlog_current_version: >-
      {{
        'NOT_INSTALLED' if not nxlog_service_check.exists and 
                          not nxlog_exe_check.stat.exists
        else 'INSTALLED_NO_VERSION'
      }}

# ============================================================================
# CONDITIONS D'INSTALLATION
# ============================================================================
- name: Déterminer si installation/mise à jour est nécessaire
  set_fact:
    nxlog_needs_install: >-
      {{
        nxlog_current_version == 'NOT_INSTALLED' or
        nxlog_current_version == 'INSTALLED_NO_VERSION'
      }}

# ============================================================================
# INSTALLATION/MISE À JOUR (seulement si nécessaire)
# ============================================================================
- name: Créer le répertoire temporaire Windows (si nécessaire)
  win_file:
    path: '{{ nxlog_windows_temp_dir }}'
    state: directory
  when: nxlog_needs_install|bool

- name: Copier le MSI NXLog (si nécessaire)
  win_copy:
    src: '{{ nxlog_msi_filename }}'
    dest: '{{ nxlog_windows_temp_dir }}\{{ nxlog_msi_filename }}'
  when: nxlog_needs_install|bool

- name: Installer/Mettre à jour NXLog Windows
  win_package:
    path: '{{ nxlog_windows_temp_dir }}\{{ nxlog_msi_filename }}'
    state: present
    arguments: '{{ nxlog_msi_arguments }}'
  register: nxlog_installation
  when: nxlog_needs_install|bool

# ============================================================================
# DÉTECTION DU CHEMIN D'INSTALLATION
# ============================================================================
- name: Tester les chemins d'installation possibles
  win_stat:
    path: '{{ item }}\nxlog.exe'
  loop:
    - 'C:\Program Files\nxlog'
    - 'C:\Program Files (x86)\nxlog'
  register: nxlog_path_tests
  when: nxlog_installation is changed or nxlog_current_version != 'NOT_INSTALLED'

- name: Déterminer le chemin d'installation
  set_fact:
    nxlog_actual_install_dir: >-
      {{
        (nxlog_path_tests.results |
        selectattr('stat.exists', 'equalto', true) |
        map(attribute='item') |
        first)
        if nxlog_path_tests.results is defined and nxlog_path_tests.results
        else nxlog_windows_install_dir
      }}
  when: nxlog_installation is changed or nxlog_current_version != 'NOT_INSTALLED'

- name: Définir le chemin de configuration
  set_fact:
    nxlog_final_conf_dir: '{{ nxlog_actual_install_dir }}\conf'
  when: nxlog_installation is changed or nxlog_current_version != 'NOT_INSTALLED'

# ============================================================================
# CONFIGURATION
# ============================================================================
- name: Créer le répertoire de configuration Windows
  win_file:
    path: '{{ nxlog_final_conf_dir }}'
    state: directory
  when: nxlog_installation is changed or nxlog_current_version != 'NOT_INSTALLED'

- name: Déployer la configuration NXLog Windows
  win_template:
    src: nxlog-windows.conf.j2
    dest: '{{ nxlog_final_conf_dir }}\nxlog.conf'
  notify: restart nxlog windows
  when: nxlog_installation is changed or nxlog_current_version != 'NOT_INSTALLED'

# ============================================================================
# GESTION DU SERVICE
# ============================================================================
- name: Vérifier l'existence du service NXLog
  win_service:
    name: '{{ nxlog_service_name }}'
    state: started
  register: service_check
  changed_when: false
  when: nxlog_installation is changed or nxlog_current_version != 'NOT_INSTALLED'

- name: Configurer le service pour démarrage automatique
  win_service:
    name: '{{ nxlog_service_name }}'
    start_mode: auto
  when: >
    (nxlog_installation is changed or nxlog_current_version != 'NOT_INSTALLED')
    and service_check.exists

- name: Avertissement si le service est manquant
  debug:
    msg: "ATTENTION : Le service '{{ nxlog_service_name }}' n'existe pas."
  when: >
    (nxlog_installation is changed or nxlog_current_version != 'NOT_INSTALLED')
    and not service_check.exists

# ============================================================================
# NETTOYAGE
# ============================================================================
- name: Nettoyer le répertoire temporaire Windows
  win_file:
    path: '{{ nxlog_windows_temp_dir }}'
    state: absent
  when: nxlog_needs_install|bool and nxlog_installation is changed