---
# ============================================================================
# IP ADDRESS - Retrieve from inventory
# ============================================================================
- name: Set host IP address from inventory
  set_fact:
    nxlog_host_ip: "{{ ansible_host }}"

# ============================================================================
# CHECK EXISTING INSTALLATION
# ============================================================================
- name: Collect installed package information
  package_facts:
    manager: auto
  changed_when: false

- name: Determine installed NXLog version
  set_fact:
    nxlog_current_version: >-
      {{
        ansible_facts.packages['nxlog-ce'][0].version
        if 'nxlog-ce' in ansible_facts.packages
        else 'NOT_INSTALLED'
      }}

# ============================================================================
# INSTALLATION CONDITIONS
# ============================================================================
- name: Determine if installation or update is required
  set_fact:
    nxlog_needs_install: >-
      {{
        nxlog_current_version == 'NOT_INSTALLED' or
        nxlog_version not in nxlog_current_version
      }}

# ============================================================================
# PREREQUISITES
# ============================================================================
- name: Install missing prerequisites
  apt:
    name: "{{ nxlog_linux_prerequisites }}"
    state: present
  when: nxlog_needs_install | bool
  become: yes

# ============================================================================
# INSTALLATION / UPDATE (only if required)
# ============================================================================
- name: Create temporary directory
  file:
    path: '{{ nxlog_linux_temp_dir }}'
    state: directory
    mode: '0755'
  when: nxlog_needs_install | bool

- name: Copy NXLog DEB package
  copy:
    src: '{{ nxlog_deb_filename }}'
    dest: '{{ nxlog_linux_temp_dir }}/{{ nxlog_deb_filename }}'
    mode: '0644'
  when: nxlog_needs_install | bool

- name: Install NXLog Linux
  apt:
    deb: '{{ nxlog_linux_temp_dir }}/{{ nxlog_deb_filename }}'
    state: present
    force: yes
    allow_downgrade: yes
  when: nxlog_needs_install | bool
  register: nxlog_installation_result
  notify: restart nxlog linux
  become: yes

# ============================================================================
# CONFIGURATION
# ============================================================================
- name: Create NXLog configuration directory
  file:
    path: "/etc/nxlog"
    state: directory
    mode: '0755'
  become: yes

- name: Deploy NXLog Linux configuration
  template:
    src: nxlog.conf.j2
    dest: '{{ nxlog_linux_conf_path }}'
    mode: '0644'
    owner: root
    group: root
  notify: restart nxlog linux
  become: yes

# ============================================================================
# SERVICE MANAGEMENT
# ============================================================================
- name: Ensure NXLog service is started and enabled
  systemd:
    name: '{{ nxlog_service_name }}'
    state: started
    enabled: yes
  become: yes

# ============================================================================
# CLEANUP
# ============================================================================
- name: Remove temporary directory
  file:
    path: '{{ nxlog_linux_temp_dir }}'
    state: absent
  when: nxlog_needs_install | bool and nxlog_installation_result is changed