---
# ============================================================================
# FORÇAGE DE L'ADRESSE IP - MÊME SOLUTION QUE WINDOWS
# ============================================================================
- name: FORCER l'adresse IP depuis l'inventaire Linux
  set_fact:
    nxlog_host_ip: "{{ ansible_host }}"

# ============================================================================
# VÉRIFICATION DE L'INSTALLATION EXISTANTE
# ============================================================================
- name: Vérifier si NXLog est déjà installé à la bonne version
  set_fact:
    # Initialiser comme non installé par défaut
    nxlog_current_version: "NOT_INSTALLED"
    # Flag pour indiquer si on a besoin de vérifier en détail
    needs_detailed_check: true

# Seulement collecter les facts packages si nécessaire
- name: Collecter les informations des paquets installés (conditionnel)
  package_facts:
    manager: auto
  when: needs_detailed_check|bool
  register: package_facts_result
  changed_when: false

- name: Déterminer la version NXLog installée (seulement si facts collectés)
  set_fact:
    nxlog_current_version: >-
      {{
        package_facts_result.ansible_facts.packages['nxlog-ce'][0].version
        if package_facts_result is changed and 
           'nxlog-ce' in package_facts_result.ansible_facts.packages
        else 'NOT_INSTALLED'
      }}
  when: needs_detailed_check|bool and package_facts_result is changed

# ============================================================================
# CONDITIONS D'INSTALLATION
# ============================================================================
- name: Déterminer si installation/mise à jour est nécessaire
  set_fact:
    nxlog_needs_install: >-
      {{
        nxlog_current_version == 'NOT_INSTALLED' or
        (nxlog_current_version != 'NOT_INSTALLED' and 
         nxlog_version not in nxlog_current_version)
      }}

# ============================================================================
# VÉRIFICATION DES PRÉREQUIS
# ============================================================================
- name: Vérifier et installer les prérequis manquants
  apt:
    name: "{{ nxlog_linux_prerequisites }}"
    state: present
  when: nxlog_needs_install|bool
  become: yes
  register: prereq_install

# ============================================================================
# INSTALLATION/MISE À JOUR (seulement si nécessaire)
# ============================================================================
- name: Créer le répertoire temporaire (si nécessaire)
  file:
    path: '{{ nxlog_linux_temp_dir }}'
    state: directory
    mode: '0755'
  when: nxlog_needs_install|bool

- name: Copier le package DEB Linux (si nécessaire)
  copy:
    src: '{{ nxlog_deb_filename }}'
    dest: '{{ nxlog_linux_temp_dir }}/{{ nxlog_deb_filename }}'
    mode: '0644'
  when: nxlog_needs_install|bool

- name: Installer NXLog Linux
  apt:
    deb: '{{ nxlog_linux_temp_dir }}/{{ nxlog_deb_filename }}'
    state: present
    force: yes
    allow_downgrade: yes
  when: nxlog_needs_install|bool
  register: nxlog_installation_result
  notify: restart nxlog linux
  become: yes

# ============================================================================
# CONFIGURATION
# ============================================================================
- name: Créer le répertoire de configuration Linux
  file:
    path: "/etc/nxlog"
    state: directory
    mode: '0755'
  become: yes

- name: Déployer la configuration NXLog Linux
  template:
    src: nxlog.conf.j2
    dest: '{{ nxlog_linux_conf_path }}'
    mode: '0644'
    owner: root
    group: root
  notify: restart nxlog linux
  become: yes

# ============================================================================
# GESTION DU SERVICE
# ============================================================================
- name: S'assurer que le service NXLog est démarré et activé
  systemd:
    name: '{{ nxlog_service_name }}'
    state: started
    enabled: yes
  become: yes

# ============================================================================
# NETTOYAGE
# ============================================================================
- name: Nettoyer le répertoire temporaire Linux
  file:
    path: '{{ nxlog_linux_temp_dir }}'
    state: absent
  when: nxlog_needs_install|bool and nxlog_installation_result is changed