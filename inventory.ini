# ============ WINDOWS SERVERS ============
[windows_servers]
YOUR-WINDOWS-HOST-1 ansible_host=YOUR_WINDOWS_IP_1
YOUR-WINDOWS-HOST-2 ansible_host=YOUR_WINDOWS_IP_2 ansible_port=5985

[windows_servers:vars]
ansible_user=Administrator@YOUR.DOMAIN
ansible_connection=winrm
ansible_winrm_transport=kerberos
ansible_winrm_server_cert_validation=ignore
ansible_winrm_operation_timeout_sec=60
ansible_winrm_read_timeout_sec=70

# ============ LINUX SERVERS ============
[linux_servers]
YOUR-LINUX-HOST ansible_host=YOUR_LINUX_IP

[linux_servers:vars]
ansible_user=YOUR_SSH_USER
ansible_connection=ssh
ansible_become=yes
ansible_become_method=sudo
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_timeout=30
ansible_ssh_private_key_file=~/.ssh/ansible_unified

# ============ COMBINED GROUPS ============
[all:children]
windows_servers
linux_servers
