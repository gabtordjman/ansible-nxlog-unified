# ============ WINDOWS SERVERS ============
[windows_servers]
VM-SRV2019-AD ansible_host=192.168.1.253
VMW10SYSLOG ansible_host=192.168.1.206 ansible_port=5985

[windows_servers:vars]
ansible_user=Administrateur@MAINTENANCE.LAB
ansible_connection=winrm
ansible_winrm_transport=kerberos
ansible_winrm_server_cert_validation=ignore
ansible_winrm_operation_timeout_sec=60
ansible_winrm_read_timeout_sec=70

# ============ LINUX SERVERS ============
[linux_servers]
grafana-aio ansible_host=192.168.1.207

[linux_servers:vars]
ansible_user=toto
ansible_connection=ssh
ansible_become=yes
ansible_become_method=sudo
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_timeout=30
ansible_ssh_private_key_file=~/.ssh/ansible_unified

# ============ GROUPES COMBINÉS ============
[all:children]
windows_servers
linux_servers
